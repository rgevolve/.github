name: PyPI publish

on:
  workflow_call:
    inputs:
      repository-url:
        type: string
        required: false
        default: ''
        description: 'Override the upload target (e.g. https://test.pypi.org/legacy/ for TestPyPI). Empty = production PyPI.'

jobs:
  build-and-publish:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify version is final (production target only)
        if: inputs.repository-url == ''
        run: |
          VERSION=$(ls dist/*.tar.gz | sed -E 's|.*-(.*)\.tar\.gz|\1|')
          echo "Built version: $VERSION"
          case "$VERSION" in
            *+*|*dev*) echo "Refusing to publish non-final version $VERSION to production PyPI"; exit 1 ;;
          esac

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository-url }}
